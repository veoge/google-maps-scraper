<tr data-job-id="{{.ID}}" data-status="{{.Status}}">
    <td title="{{.ID}}">{{ slice .ID 0 8 }}</td>
    <td class="cell-title">{{.Name}}</td>
    <td class="nowrap muted">{{.Date}}</td>
    <td><span class="badge status-{{.Status}}">{{.Status}}</span></td>
    <td class="nowrap job-duration" data-started="{{.StartedUnix}}" data-duration="{{.DurationSeconds}}" data-status="{{.Status}}"></td>
    <td class="nowrap">
        <div class="btn-group">
            {{ if eq .Status "paused" }}
                <button type="button" class="btn btn-sm btn-continue"
                        hx-post="/continue?id={{.ID}}"
                        hx-target="closest tr"
                        hx-swap="outerHTML"
                        title="{{.Data.PausedReason}}">Continue</button>
                <a class="btn btn-sm" href="/download?id={{.ID}}&amp;format=xlsx" download>Excel</a>
            {{ end }}
            {{ if eq .Status "ok" }}
                <button type="button" class="btn btn-sm" onclick="selectJob('{{.ID}}', '{{.Name}}')">Results</button>
                <a class="btn btn-sm" href="/download?id={{.ID}}&amp;format=xlsx" download>Excel</a>
                <button type="button" class="btn btn-sm"
                        hx-post="/restart?id={{.ID}}"
                        hx-target="#job-rows"
                        hx-swap="afterbegin"
                        hx-confirm="Run this scan again with the same settings?">Restart</button>
            {{ end }}
            <button type="button" class="btn btn-sm btn-danger"
                    hx-delete="/delete?id={{.ID}}"
                    hx-target="closest tr"
                    hx-swap="outerHTML"
                    hx-confirm="Delete this job and its results?">Delete</button>
        </div>
    </td>
</tr>
